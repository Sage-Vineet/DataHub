schema: spec-driven

# Project context — shown to AI when creating artifacts.
context: |
  DataHub — multi-tenant M&A / accounting platform: a broker<->client portal with
  QuickBooks Online integration and AI-assisted financial-document extraction.

  CURRENT stack (being re-architected):
    - Frontend: React 19 + Vite SPA, HashRouter, Tailwind. ~70k LOC, 100% JS.
    - Backend: Express / Node, 100% JS. Supabase/Postgres.
    - Integrations: QuickBooks Online OAuth; Microsoft Graph (email);
      AI extraction via Gemini + Anthropic Claude + a Python OCR/PDF pipeline.
    - Auth: JWT (HS256), bcrypt, OTP. Multi-tenant isolation via canAccessCompany().

  TARGET stack (see docs/MODERNIZATION_PLAN.md — locked decisions):
    - TypeScript everywhere. pnpm workspaces + Turborepo monorepo:
      packages/{contracts,db,config}, apps/{web,api}, legacy/ retired per-domain.
    - Drizzle ORM (introspected from prod Postgres) replaces the Supabase-vs-pg dual path.
    - zod contracts (shared FE/BE), @tanstack/react-query, express-rate-limit + helmet,
      pino, vitest + supertest, GitHub Actions CI.
    - Backend: PARALLEL REWRITE behind a gateway, cut over per route-group.
      Frontend: INCREMENTAL in-place TS migration.
    - Modular monolith first; extract the AI extraction pipeline as microservice #1 later.
    - Cutover order: config/contracts/db -> auth (reference) -> companies/users/folders
      -> uploads/requests/messages -> reports (decompose the 9,088-line GL service)
      -> quickbooks -> extraction.

  KNOWN DEBT to pay down (from the 2026-08 audit — DataHub_Engineering_Audit.docx):
    - Dual data-access path (Supabase client + 9 raw pg pools); no authoritative schema
      (2 schema.sql files + 76 migrations, 19 duplicate numbers, runtime CREATE TABLE).
    - God-files: manualGlMultiYearService.js (9,088), WorkspaceCimPrep.jsx (5,055),
      WorkspaceReconciliation.jsx (3,788), FileExplorer.jsx (2,832).
    - 0 automated tests; 0% TypeScript; backend lint is a no-op; 863 raw console calls;
      31 swallowed catch blocks; 112 scattered process.env reads.

  PRODUCT SOURCE (docs/product/ — authoritative, vendored):
    - The whole intended product surface: 98 features across 14 modules in the
      `Centuriuum Product Listing`, plus 59 per-feature specification documents
      (Josh Tonnesen, 14 Aug 2026) in a fixed 10-section format.
    - source/ holds the originals and is authoritative; markdown/ holds deterministic
      text conversions for reading and diffing and is NEVER cited as the source of a
      requirement. Where a spec and its source document disagree, the document governs.
    - Cite the feature ID (e.g. `QE - 0004`, `SY - 0003`) in any requirement derived
      from this material, so it can be checked back against source/ in one step.
    - The whole-surface capability map is the PRODUCT SURFACE REGISTER at openspec/product/
      (see its README.md). Its design.md §D3 records which features are specified vs. sketch
      fidelity, and Register A reconciles the identifiers that changed between list revisions.
    - IDs have been renumbered twice. The SE module folded into SY (SE-0001/0002 ->
      SY-0001/0002, SE-0004 -> SY-0003, SE-0003 -> DR-0009), System shifted by three,
      and e-signature is SY-0007. The source documents still use the OLD numbers inside
      their own bodies — trust the header ID, and check Register A before citing one.

  CAPABILITY TAXONOMY (decided 18 Aug 2026 — two registers, never merged):
    - openspec/specs/ is the BASELINE: what the system does today, in shipped code. It is
      keyed by MIGRATION-DOMAIN name (auth, users, companies, folders, uploads, requests,
      messages, reports, activity-log, platform/*). A change adds to it; archiving a change
      syncs it. Nothing enters it that is not built.
    - openspec/product/ is the PRODUCT SURFACE REGISTER: what the product should eventually
      be, keyed by PRODUCT-MODULE name (access-control, qoe, cim, data-room, valuations,
      financial-data, ...). It is outside changes/ on purpose and is NEVER synced — 448
      requirements of mostly-unbuilt intent would make the baseline ~90% aspiration.
    - Names overlap across the two registers and that is expected; they are different views
      of one product. activity-log and reports appear in both; users <-> user-profiles,
      folders+uploads <-> data-room, auth+companies <-> access-control, platform/* <->
      platform-services. Growing the built system toward the surface is an explicit change,
      reconciled per capability — product/design.md §D6 is the worked example for reports.

  WORKING CONVENTIONS:
    - Active branch is `ba/rearch` (main is FROZEN at e56ff1b — never commit to main).
    - Conventional Commits (feat:/fix:/chore:/refactor:/docs:).
    - Every new backend domain module = router + service + repository + zod contract + tests;
      cross-module calls only through typed service interfaces (keeps microservice option open).
    - No new code without tests. Prefer standard deps over hand-rolled infrastructure.

# Per-artifact rules
rules:
  proposal:
    - State which cutover-order domain (above) the change belongs to.
    - Include a "Non-goals" section and call out any main-branch/legacy impact.
  tasks:
    - Every task that adds or changes backend behavior must include a vitest/supertest task.
  spec:
    - Delta specs live under a change and use ADDED/MODIFIED/REMOVED Requirements headers.
      Baseline specs under openspec/specs/ use a plain "## Requirements" header and carry no
      operation headers — strip them on sync.
    - Every spec, delta or baseline, opens with a "## Purpose" section.
    - A change at 100% of its tasks must be synced and archived. Leaving completed changes
      unarchived is what stranded 44 requirements of shipped behaviour in Aug 2026.
