name: CI

on:
  pull_request:
    branches: [ba/rearch]
  push:
    branches: [ba/rearch]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck · lint · test · audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans the pushed commit range, which needs the history that
          # range refers to. The default shallow checkout has depth 1 and would
          # silently reduce the scan to a single commit.
          fetch-depth: 0

      # Secret scanning. A live Gmail app password reached this repository once
      # (engineering audit, finding C3) and is still in history; rotating it and
      # purging history are tracked separately and are CTO-owned. This step is
      # the forward guard, and it is a hard gate: unlike the dependency audit
      # below there is no known-unfixable backlog to work around, and a leaked
      # credential is not something to merge and schedule.
      #
      # Runs before install so a secret in a pull request fails in ~10 seconds
      # rather than after the whole build.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # No GITLEAKS_LICENSE: required only for organization accounts.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Structural check on the spec system. Cheap, no build needed, and it is the
      # gate that catches a completed change left unsynced/unarchived (Aug 2026).
      - name: Validate OpenSpec
        run: node tools/openspec/validate.mjs

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      # The coverage ratchet. Every package that declares thresholds enforces
      # them here; `pnpm run test` above does not, because `vitest run` without
      # --coverage ignores them entirely — so the step that used to be labelled
      # "test (with coverage gate)" was not gating anything.
      #
      # The legacy thresholds are low on purpose (backend 4.5%, web 1.9%): they
      # are set at what the suite actually covers so the only thing they forbid
      # is regression. Raise the number in the package's vitest config when you
      # add tests. ADR-0005's 90%+ standard applies to new code, which the
      # TypeScript packages gate at separately.
      - name: Coverage thresholds
        run: pnpm run test:cov

      # Dependency audit. Non-blocking for now: xlsx / pdf-parse carry high
      # advisories with no upstream fix (audit finding H7); this step ratchets
      # to a hard gate once those are replaced in a later phase.
      - name: Dependency audit
        continue-on-error: true
        run: pnpm audit --audit-level=high
